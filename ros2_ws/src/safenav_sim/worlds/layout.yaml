edges:
  - {from: reception, to: kitchen, relation: adjacent}
  - {from: kitchen, to: meeting_room_a, relation: adjacent}
  - {from: meeting_room_a, to: meeting_room_b, relation: adjacent}
  - {from: meeting_room_b, to: office, relation: adjacent}
  - {from: server_room, to: charging_dock, relation: adjacent}
  - {from: charging_dock, to: storage_room, relation: adjacent}
  - {from: storage_room, to: lab, relation: adjacent}
  - {from: lab, to: workshop, relation: adjacent}
  - {from: reception, to: server_room, relation: near}
  - {from: kitchen, to: charging_dock, relation: near}
  - {from: meeting_room_a, to: storage_room, relation: near}
  - {from: meeting_room_b, to: lab, relation: near}
  - {from: office, to: workshop, relation: near}
  - {from: charging_dock, to: storage_room, relation: left_of}
  - {from: storage_room, to: charging_dock, relation: right_of}
  - {from: kitchen, to: reception, relation: right_of}
